name: Sync Docker Images to Aliyun ACR

on:
  push:
    branches: [ main, master ]
    paths:
      - 'images.txt'
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install skopeo
        run: |
          command -v skopeo >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y skopeo)

      - name: Login to Aliyun ACR
        run: |
          echo "${{ secrets.ALIYUN_PASSWORD }}" | skopeo login "${{ secrets.ALIYUN_REGISTRY }}" -u "${{ secrets.ALIYUN_USERNAME }}" --password-stdin

      - name: Sync linux/amd64 images from images.txt
        env:
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            line=$(echo "$line" | tr -d '\r' | xargs)
            [[ -z "$line" || "$line" == \#* ]] && continue
            image="${line%%#*}"
            image=$(echo "$image" | xargs)

            if [[ "$image" != *.*/* && "$image" != localhost:* ]]; then
              if [[ "$image" != */* ]]; then
                src="docker.io/library/$image"
              else
                src="docker.io/$image"
              fi
            else
              src="$image"
            fi

            repo_and_tag="${src##*/}"
            dest="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${repo_and_tag}"

            echo "=========================================="
            echo "Syncing [linux/amd64]: ${src} -> ${dest}"
            skopeo copy --override-os linux --override-arch amd64 --retry-times 3 "docker://${src}" "docker://${dest}"
          done < images.txt
